# Cockpit theme: clean and light, one accent colour. In the data, blue = up / buy, red = down / sell, grey = neutral.

[browser]
gatherUsageStats = false

[theme]
base = "light"
primaryColor = "#2563eb"
backgroundColor = "#ffffff"
secondaryBackgroundColor = "#f4f5f7"
textColor = "#1f2328"
borderColor = "#e3e5e8"
linkColor = "#2563eb"
font = "Inter:https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&display=swap, sans-serif"
headingFont = "Inter:https://fonts.googleapis.com/css2?family=Inter:wght@500;600&display=swap, sans-serif"
codeFont = "JetBrains Mono:https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500&display=swap, monospace"
baseRadius = "medium"
showWidgetBorder = true
dataframeBorderColor = "#eceef1"
dataframeHeaderBackgroundColor = "#f8f9fa"
greenColor = "#16a34a"
redColor = "#dc2626"
orangeColor = "#d97706"
chartCategoricalColors = ["#2563eb", "#ea580c", "#16a34a", "#9333ea", "#0891b2", "#ca8a04", "#db2777", "#64748b"]
chartDivergingColors = ["#b91c1c", "#dc2626", "#f87171", "#fecaca", "#e5e7eb", "#bfdbfe", "#60a5fa", "#2563eb", "#1d4ed8"]
chartSequentialColors = ["#eff6ff", "#dbeafe", "#bfdbfe", "#93c5fd", "#60a5fa", "#3b82f6", "#2563eb", "#1d4ed8", "#1e40af", "#1e3a8a"]
