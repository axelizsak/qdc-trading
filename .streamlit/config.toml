# Cockpit theme: black terminal, amber accent, one fixed dark theme.
# Data colours are the colour-blind-validated dark steps (blue = up/buy, red = down/sell).

[browser]
gatherUsageStats = false

[theme]
base = "dark"
primaryColor = "#ffa31a"
backgroundColor = "#000000"
secondaryBackgroundColor = "#0e0e0e"
textColor = "#e6e3dc"
borderColor = "#232323"
linkColor = "#ffb547"
font = "IBM Plex Sans:https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600&display=swap, sans-serif"
headingFont = "IBM Plex Mono:https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600&display=swap, monospace"
codeFont = "IBM Plex Mono:https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600&display=swap, monospace"
baseRadius = "small"
showWidgetBorder = true
dataframeBorderColor = "#1c1c1c"
dataframeHeaderBackgroundColor = "#0b0b0b"
orangeColor = "#ffa31a"
codeTextColor = "#d8d5ce"
codeBackgroundColor = "#161616"
greenColor = "#22c55e"
redColor = "#ef5b5b"
chartCategoricalColors = ["#3987e5", "#d95926", "#199e70", "#c98500", "#d55181", "#008300", "#9085e9", "#e66767"]
chartDivergingColors = ["#e66767", "#c95453", "#8f3f3e", "#4a2a29", "#2b2b2b", "#1c3157", "#1c5cab", "#3987e5", "#86b6ef"]
chartSequentialColors = ["#0d2440", "#104281", "#184f95", "#1c5cab", "#256abf", "#2a78d6", "#3987e5", "#5598e7", "#6da7ec", "#86b6ef"]
